<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurnal Încărcare Renault Zoe</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1, h2 {
            text-align: center;
            color: #2c3e50;
        }
        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .full-width {
            grid-column: span 2;
        }
        label {
            font-weight: bold;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 15px;
            box-sizing: border-box;
        }
        .btn {
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-primary {
            background-color: #27ae60;
            color: white;
        }
        .btn-primary:hover {
            background-color: #219150;
        }
        .btn-export {
            background-color: #2980b9;
            color: white;
            margin-top: 15px;
            width: 100%;
        }
        .btn-delete {
            background-color: #e74c3c;
            color: white;
            padding: 5px 10px;
            font-size: 12px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 14px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #2c3e50;
            color: white;
        }
        .table-container {
            overflow-x: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Jurnal Încărcare Zoe (2013)</h1>

    <form id="chargeForm">
        <div>
            <label for="date">Data și Ora:</label>
            <input type="datetime-local" id="date" required>
        </div>
        <div>
            <label for="km">Kilometraj (km):</label>
            <input type="number" id="km" placeholder="ex: 125000" required>
        </div>
        <div>
            <label for="batteryStart">Baterie Start (%):</label>
            <input type="number" id="batteryStart" placeholder="ex: 20" min="0" max="100" required>
        </div>
        <div>
            <label for="batteryEnd">Baterie Final (%):</label>
            <input type="number" id="batteryEnd" placeholder="ex: 80" min="0" max="100" required>
        </div>
        <div>
            <label for="kwh">Energie Încărcată (kWh):</label>
            <input type="number" id="kwh" step="0.01" placeholder="ex: 15.5" required>
        </div>
        <div>
            <label for="cost">Cost Total (RON):</label>
            <input type="number" id="cost" step="0.01" placeholder="ex: 45.5" required>
        </div>
        <div class="full-width">
            <button type="submit" class="btn btn-primary">Adaugă Înregistrare</button>
        </div>
    </form>

    <h2>Istoric Încărcări</h2>
    <div class="table-container">
        <table id="logsTable">
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Km</th>
                    <th>Baterie</th>
                    <th>kWh</th>
                    <th>Cost</th>
                    <th>kWh/100km</th>
                    <th>RON/100km</th>
                    <th>Acțiune</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>

    <button id="exportBtn" class="btn btn-export">Descarcă Datele în Excel (CSV)</button>
</div>

<script>
    const form = document.getElementById('chargeForm');
    const tableBody = document.querySelector('#logsTable tbody');
    const exportBtn = document.getElementById('exportBtn');

    function getLogs() {
        const logs = localStorage.getItem('zoe_logs');
        return logs ? JSON.parse(logs) : [];
    }

    function saveLogs(logs) {
        localStorage.setItem('zoe_logs', JSON.stringify(logs));
    }

    function deleteLog(index) {
        let logs = getLogs();
        logs.splice(index, 1);
        saveLogs(logs);
        renderTable();
    }

    function renderTable() {
        let logs = getLogs();
        tableBody.innerHTML = '';

        // Sortează înregistrările după kilometraj pentru calcule corecte
        logs.sort((a, b) => Number(a.km) - Number(b.km));

        logs.forEach((log, index) => {
            const row = document.createElement('tr');
            const dateObj = new Date(log.date);
            const formattedDate = dateObj.toLocaleDateString('ro-RO') + ' ' + dateObj.toLocaleTimeString('ro-RO', {hour: '2-digit', minute:'2-digit'});

            let kwhPer100 = '-';
            let ronPer100 = '-';

            // Calculăm consumul doar de la a doua înregistrare încolo
            if (index > 0) {
                const prevKm = Number(logs[index - 1].km);
                const currentKm = Number(log.km);
                const dist = currentKm - prevKm;

                if (dist > 0) {
                    kwhPer100 = ((Number(log.kwh) / dist) * 100).toFixed(2);
                    ronPer100 = ((Number(log.cost) / dist) * 100).toFixed(2);
                }
            }

            row.innerHTML = `
                <td>${formattedDate}</td>
                <td>${log.km}</td>
                <td>${log.batteryStart}% → ${log.batteryEnd}%</td>
                <td>${log.kwh}</td>
                <td>${log.cost} RON</td>
                <td>${kwhPer100}</td>
                <td>${ronPer100}</td>
                <td><button class="btn-delete" onclick="deleteLog(${index})">Șterge</button></td>
            `;
            tableBody.appendChild(row);
        });
    }

    form.addEventListener('submit', function(event) {
        event.preventDefault();

        const logEntry = {
            date: document.getElementById('date').value,
            km: document.getElementById('km').value,
            batteryStart: document.getElementById('batteryStart').value,
            batteryEnd: document.getElementById('batteryEnd').value,
            kwh: document.getElementById('kwh').value,
            cost: document.getElementById('cost').value
        };

        const logs = getLogs();
        logs.push(logEntry);
        saveLogs(logs);
        renderTable();
        form.reset();
        setCustomDate();
    });

    function setCustomDate() {
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('date').value = now.toISOString().slice(0,16);
    }

    exportBtn.addEventListener('click', function() {
        const logs = getLogs();
        if (logs.length === 0) {
            alert('Nu există date de exportat!');
            return;
        }

        let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
        csvContent += "Data,Km,Baterie Start,Baterie Final,kWh,Cost RON\n";

        logs.forEach(log => {
            csvContent += `"${log.date}","${log.km}","${log.batteryStart}","${log.batteryEnd}","${log.kwh}","${log.cost}"\n`;
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "jurnal_zoe.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });

    setCustomDate();
    renderTable();
</script>

</body>
</html>
