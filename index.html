<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurnal Încărcare Renault Zoe</title>
    
    <!-- Librăriile Firebase web (CDN) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1, h2 {
            text-align: center;
            color: #2c3e50;
        }
        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .full-width {
            grid-column: span 2;
        }
        label {
            font-weight: bold;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 15px;
            box-sizing: border-box;
        }
        .btn {
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-primary {
            background-color: #27ae60;
            color: white;
        }
        .btn-primary:hover {
            background-color: #219150;
        }
        .btn-delete {
            background-color: #e74c3c;
            color: white;
            padding: 5px 10px;
            font-size: 12px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 14px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #2c3e50;
            color: white;
        }
        .table-container {
            overflow-x: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Jurnal Încărcare Zoe (Cloud Sync)</h1>

    <form id="chargeForm">
        <div>
            <label for="date">Data și Ora:</label>
            <input type="datetime-local" id="date" required>
        </div>
        <div>
            <label for="km">Kilometraj (km):</label>
            <input type="number" id="km" placeholder="ex: 125000" required>
        </div>
        <div>
            <label for="batteryStart">Baterie Start (%):</label>
            <input type="number" id="batteryStart" placeholder="ex: 20" min="0" max="100" required>
        </div>
        <div>
            <label for="batteryEnd">Baterie Final (%):</label>
            <input type="number" id="batteryEnd" placeholder="ex: 80" min="0" max="100" required>
        </div>
        <div>
            <label for="kwh">Energie Încărcată (kWh):</label>
            <input type="number" id="kwh" step="0.01" placeholder="ex: 15.5" required>
        </div>
        <div>
            <label for="cost">Cost Total (RON):</label>
            <input type="number" id="cost" step="0.01" placeholder="ex: 45.5" required>
        </div>
        <div class="full-width">
            <button type="submit" class="btn btn-primary">Adaugă Înregistrare</button>
        </div>
    </form>

    <h2>Istoric Încărcări</h2>
    <div class="table-container">
        <table id="logsTable">
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Km</th>
                    <th>Baterie</th>
                    <th>kWh</th>
                    <th>Cost</th>
                    <th>kWh/100km</th>
                    <th>RON/100km</th>
                    <th>Acțiune</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>
</div>

<script>
    // Configurația Firebase cu cheile tale specifice
    const firebaseConfig = {
        apiKey: "AIzaSyDIlGRpQGWtfdwrfZ3bllzM168UrcSyrkE",
        authDomain: "zoe-charge-log.firebaseapp.com",
        projectId: "zoe-charge-log",
        storageBucket: "zoe-charge-log.firebasestorage.app",
        messagingSenderId: "291247420360",
        appId: "1:291247420360:web:bd06ec76d83b6969ea86fd",
        measurementId: "G-4959FJEPFZ"
    };

    // Inițializare Firebase & Firestore
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const collectionRef = db.collection('incarcari_zoe');

    const form = document.getElementById('chargeForm');
    const tableBody = document.querySelector('#logsTable tbody');

    // Trimite o înregistrare nouă în Firestore
    form.addEventListener('submit', async function(event) {
        event.preventDefault();

        const logEntry = {
            date: document.getElementById('date').value,
            km: Number(document.getElementById('km').value),
            batteryStart: Number(document.getElementById('batteryStart').value),
            batteryEnd: Number(document.getElementById('batteryEnd').value),
            kwh: Number(document.getElementById('kwh').value),
            cost: Number(document.getElementById('cost').value),
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        try {
            await collectionRef.add(logEntry);
            form.reset();
            setCustomDate();
        } catch (error) {
            alert("Eroare la salvarea datelor: " + error.message);
        }
    });

    // Ascultă modificările în timp real (real-time listener)
    collectionRef.orderBy('km', 'asc').onSnapshot(snapshot => {
        let logs = [];
        snapshot.forEach(doc => {
            logs.push({ id: doc.id, ...doc.data() });
        });
        renderTable(logs);
    }, error => {
        console.error("Eroare citire Firestore:", error);
    });

    // Șterge un element din baza de date
    async function deleteLog(id) {
        if (confirm("Sigur dorești să ștergi această înregistrare?")) {
            await collectionRef.doc(id).delete();
        }
    }

    // Afișare rânduri și calcul automat consum/cost
    function renderTable(logs) {
        tableBody.innerHTML = '';

        logs.forEach((log, index) => {
            const row = document.createElement('tr');
            const dateObj = new Date(log.date);
            const formattedDate = dateObj.toLocaleDateString('ro-RO') + ' ' + dateObj.toLocaleTimeString('ro-RO', {hour: '2-digit', minute:'2-digit'});

            let kwhPer100 = '-';
            let ronPer100 = '-';

            if (index > 0) {
                const prevKm = logs[index - 1].km;
                const dist = log.km - prevKm;

                if (dist > 0) {
                    kwhPer100 = ((log.kwh / dist) * 100).toFixed(2);
                    ronPer100 = ((log.cost / dist) * 100).toFixed(2);
                }
            }

            row.innerHTML = `
                <td>${formattedDate}</td>
                <td>${log.km}</td>
                <td>${log.batteryStart}% → ${log.batteryEnd}%</td>
                <td>${log.kwh}</td>
                <td>${log.cost} RON</td>
                <td>${kwhPer100}</td>
                <td>${ronPer100}</td>
                <td><button class="btn-delete" onclick="deleteLog('${log.id}')">Șterge</button></td>
            `;
            tableBody.appendChild(row);
        });
    }

    function setCustomDate() {
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('date').value = now.toISOString().slice(0,16);
    }

    setCustomDate();
</script>

</body>
</html>
