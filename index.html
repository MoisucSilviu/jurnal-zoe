<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurnal Încărcare Renault Zoe Pro</title>
    
    <!-- Librării Firebase Web -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <!-- Librărie Grafice (Chart.js) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1, h2 {
            text-align: center;
            color: #2c3e50;
        }
        /* Dashboard cu 4 carduri */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: #eef2f7;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border-left: 4px solid #3498db;
        }
        .stat-card h3 {
            margin: 0 0 5px 0;
            font-size: 13px;
            color: #7f8c8d;
            text-transform: uppercase;
        }
        .stat-card p {
            margin: 0;
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
        }
        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .full-width {
            grid-column: span 2;
        }
        label {
            font-weight: bold;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 15px;
            box-sizing: border-box;
        }
        .btn {
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-primary {
            background-color: #27ae60;
            color: white;
            width: 100%;
        }
        .btn-primary:hover {
            background-color: #219150;
        }
        .btn-export {
            background-color: #2980b9;
            color: white;
            margin-top: 20px;
            width: 100%;
        }
        .btn-delete {
            background-color: #e74c3c;
            color: white;
            padding: 5px 10px;
            font-size: 12px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 14px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #2c3e50;
            color: white;
        }
        .table-container {
            overflow-x: auto;
        }
        .chart-container {
            margin-top: 35px;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Jurnal Încărcare Zoe (Pro)</h1>

    <!-- Tablou de bord cu statistici -->
    <div class="stats-grid">
        <div class="stat-card">
            <h3>Total Cheltuit</h3>
            <p id="statTotalCost">0 RON</p>
        </div>
        <div class="stat-card">
            <h3>Total Energie</h3>
            <p id="statTotalKwh">0 kWh</p>
        </div>
        <div class="stat-card">
            <h3>Consum Mediu</h3>
            <p id="statAvgKwh">- kWh/100km</p>
        </div>
        <div class="stat-card">
            <h3>Cost Mediu</h3>
            <p id="statAvgCost">- RON/100km</p>
        </div>
    </div>

    <!-- Formular de introducere -->
    <form id="chargeForm">
        <div>
            <label for="date">Data și Ora:</label>
            <input type="datetime-local" id="date" required>
        </div>
        <div>
            <label for="km">Kilometraj (km):</label>
            <input type="number" id="km" placeholder="ex: 125000" required>
        </div>
        <div>
            <label for="batteryStart">Baterie Start (%):</label>
            <input type="number" id="batteryStart" placeholder="ex: 20" min="0" max="100" required>
        </div>
        <div>
            <label for="batteryEnd">Baterie Final (%):</label>
            <input type="number" id="batteryEnd" placeholder="ex: 80" min="0" max="100" required>
        </div>
        <div>
            <label for="kwh">Energie Încărcată (kWh):</label>
            <input type="number" id="kwh" step="0.01" placeholder="ex: 15.5" required>
        </div>
        <div>
            <label for="cost">Cost Total (RON):</label>
            <input type="number" id="cost" step="0.01" placeholder="ex: 45.5" required>
        </div>
        <div class="full-width">
            <button type="submit" class="btn btn-primary">Adaugă Înregistrare</button>
        </div>
    </form>

    <!-- Grafic evoluție consum -->
    <div class="chart-container">
        <h2>Evoluție Consum (kWh/100km)</h2>
        <canvas id="consumptionChart"></canvas>
    </div>

    <!-- Tabel Istoric -->
    <h2>Istoric Încărcări</h2>
    <div class="table-container">
        <table id="logsTable">
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Km</th>
                    <th>Baterie</th>
                    <th>kWh</th>
                    <th>Cost</th>
                    <th>kWh/100km</th>
                    <th>RON/100km</th>
                    <th>Acțiune</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>

    <button id="exportBtn" class="btn btn-export">Descarcă Datele în Excel (CSV)</button>
</div>

<script>
    // Configurația proiectului Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyDIlGRpQGWtfdwrfZ3bllzM168UrcSyrkE",
        authDomain: "zoe-charge-log.firebaseapp.com",
        projectId: "zoe-charge-log",
        storageBucket: "zoe-charge-log.firebasestorage.app",
        messagingSenderId: "291247420360",
        appId: "1:291247420360:web:bd06ec76d83b6969ea86fd",
        measurementId: "G-4959FJEPFZ"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const collectionRef = db.collection('incarcari_zoe');

    const form = document.getElementById('chargeForm');
    const tableBody = document.querySelector('#logsTable tbody');
    const exportBtn = document.getElementById('exportBtn');
    
    let chartInstance = null;
    let currentLogs = [];

    // Adăugare date în Firebase
    form.addEventListener('submit', async function(event) {
        event.preventDefault();

        const logEntry = {
            date: document.getElementById('date').value,
            km: Number(document.getElementById('km').value),
            batteryStart: Number(document.getElementById('batteryStart').value),
            batteryEnd: Number(document.getElementById('batteryEnd').value),
            kwh: Number(document.getElementById('kwh').value),
            cost: Number(document.getElementById('cost').value),
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        try {
            await collectionRef.add(logEntry);
            form.reset();
            setCustomDate();
        } catch (error) {
            alert("❌ Eroare la salvare: " + error.message);
        }
    });

    // Ascultare și actualizare în timp real
    collectionRef.onSnapshot(snapshot => {
        let logs = [];
        snapshot.forEach(doc => {
            logs.push({ id: doc.id, ...doc.data() });
        });
        
        // Sortare crescătoare după kilometraj
        logs.sort((a, b) => Number(a.km) - Number(b.km));
        currentLogs = logs;
        
        renderApp(logs);
    }, error => {
        alert("❌ Eroare citire date: " + error.message);
    });

    // Ștergere înregistrare
    async function deleteLog(id) {
        if (confirm("Sigur dorești să ștergi această înregistrare?")) {
            try {
                await collectionRef.doc(id).delete();
            } catch (error) {
                alert("Eroare la ștergere: " + error.message);
            }
        }
    }

    // Funcția principală de randare (Tabel, Statistici, Grafic)
    function renderApp(logs) {
        tableBody.innerHTML = '';

        let totalCost = 0;
        let totalKwh = 0;
        let chartLabels = [];
        let chartData = [];

        logs.forEach((log, index) => {
            totalCost += Number(log.cost);
            totalKwh += Number(log.kwh);

            const row = document.createElement('tr');
            const dateObj = new Date(log.date);
            const formattedDate = dateObj.toLocaleDateString('ro-RO') + ' ' + dateObj.toLocaleTimeString('ro-RO', {hour: '2-digit', minute:'2-digit'});

            let kwhPer100 = '-';
            let ronPer100 = '-';

            if (index > 0) {
                const prevKm = logs[index - 1].km;
                const dist = log.km - prevKm;

                if (dist > 0) {
                    const calcKwh = ((log.kwh / dist) * 100);
                    const calcRon = ((log.cost / dist) * 100);
                    kwhPer100 = calcKwh.toFixed(2);
                    ronPer100 = calcRon.toFixed(2);

                    chartLabels.push(formattedDate);
                    chartData.push(calcKwh.toFixed(2));
                }
            }

            row.innerHTML = `
                <td>${formattedDate}</td>
                <td>${log.km}</td>
                <td>${log.batteryStart}% → ${log.batteryEnd}%</td>
                <td>${log.kwh}</td>
                <td>${log.cost} RON</td>
                <td>${kwhPer100}</td>
                <td>${ronPer100}</td>
                <td><button class="btn-delete" onclick="deleteLog('${log.id}')">Șterge</button></td>
            `;
            tableBody.appendChild(row);
        });

        // Actualizare Panou Statistici
        document.getElementById('statTotalCost').innerText = totalCost.toFixed(2) + ' RON';
        document.getElementById('statTotalKwh').innerText = totalKwh.toFixed(2) + ' kWh';

        if (logs.length > 1) {
            const totalDist = logs[logs.length - 1].km - logs[0].km;
            if (totalDist > 0) {
                let sumKwhAfterFirst = 0;
                let sumCostAfterFirst = 0;
                for(let i = 1; i < logs.length; i++) {
                    sumKwhAfterFirst += Number(logs[i].kwh);
                    sumCostAfterFirst += Number(logs[i].cost);
                }
                const avgKwh = (sumKwhAfterFirst / totalDist) * 100;
                const avgCost = (sumCostAfterFirst / totalDist) * 100;

                document.getElementById('statAvgKwh').innerText = avgKwh.toFixed(2) + ' kWh/100km';
                document.getElementById('statAvgCost').innerText = avgCost.toFixed(2) + ' RON/100km';
            }
        } else {
            document.getElementById('statAvgKwh').innerText = '- kWh/100km';
            document.getElementById('statAvgCost').innerText = '- RON/100km';
        }

        // Desenare/Actualizare Grafic Chart.js
        renderChart(chartLabels, chartData);
    }

    function renderChart(labels, data) {
        const ctx = document.getElementById('consumptionChart').getContext('2d');
        
        if (chartInstance) {
            chartInstance.destroy();
        }

        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Consum (kWh/100km)',
                    data: data,
                    borderColor: '#27ae60',
                    backgroundColor: 'rgba(39, 174, 96, 0.1)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.3
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: false,
                        title: { display: true, text: 'kWh / 100 km' }
                    }
                }
            }
        });
    }

    // Export CSV
    exportBtn.addEventListener('click', function() {
        if (currentLogs.length === 0) {
            alert('Nu există date de exportat!');
            return;
        }

        let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
        csvContent += "Data,Km,Baterie Start,Baterie Final,kWh,Cost RON\n";

        currentLogs.forEach(log => {
            csvContent += `"${log.date}","${log.km}","${log.batteryStart}","${log.batteryEnd}","${log.kwh}","${log.cost}"\n`;
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "jurnal_zoe.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });

    function setCustomDate() {
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('date').value = now.toISOString().slice(0,16);
    }

    setCustomDate();
</script>

</body>
</html>
