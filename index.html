<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurnal Încărcare Renault Zoe Pro</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1, h2 {
            text-align: center;
            color: #2c3e50;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: #eef2f7;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border-left: 4px solid #3498db;
        }
        .stat-card h3 {
            margin: 0 0 5px 0;
            font-size: 13px;
            color: #7f8c8d;
            text-transform: uppercase;
        }
        .stat-card p {
            margin: 0;
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
        }
        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .full-width {
            grid-column: span 2;
        }
        label {
            font-weight: bold;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 15px;
            box-sizing: border-box;
        }
        .btn {
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-primary {
            background-color: #27ae60;
            color: white;
            width: 100%;
        }
        .btn-primary:hover {
            background-color: #219150;
        }
        .btn-export {
            background-color: #2980b9;
            color: white;
            margin-top: 20px;
            width: 100%;
        }
        .btn-delete {
            background-color: #e74c3c;
            color: white;
            padding: 5px 10px;
            font-size: 12px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 14px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #2c3e50;
            color: white;
        }
        .table-container {
            overflow-x: auto;
        }
        .chart-container {
            margin-top: 35px;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Jurnal Încărcare Zoe (Abonament 14-14)</h1>

    <div class="stats-grid">
        <div class="stat-card">
            <h3>Total Cheltuit</h3>
            <p id="statTotalCost">0 RON</p>
        </div>
        <div class="stat-card">
            <h3>Total Energie</h3>
            <p id="statTotalKwh">0 kWh</p>
        </div>
        <div class="stat-card">
            <h3>Consum Mediu</h3>
            <p id="statAvgKwh">- kWh/100km</p>
        </div>
        <div class="stat-card">
            <h3>Cost Mediu</h3>
            <p id="statAvgCost">- RON/100km</p>
        </div>
    </div>

    <form id="chargeForm">
        <div>
            <label for="date">Data și Ora:</label>
            <input type="datetime-local" id="date" required>
        </div>
        <div>
            <label for="km">Kilometraj (km):</label>
            <input type="number" id="km" placeholder="ex: 125000" required>
        </div>
        <div>
            <label for="batteryStart">Baterie Start (%):</label>
            <input type="number" id="batteryStart" placeholder="ex: 20" min="0" max="100" required>
        </div>
        <div>
            <label for="batteryEnd">Baterie Final (%):</label>
            <input type="number" id="batteryEnd" placeholder="ex: 80" min="0" max="100" required>
        </div>
        <div>
            <label for="kwh">Energie Încărcată (kWh):</label>
            <input type="number" id="kwh" step="0.01" placeholder="ex: 15.5" required>
        </div>
        <div>
            <label for="useSubscription">Tip Încărcare:</label>
            <select id="useSubscription">
                <option value="true">Din Abonament (200 RON / 120 kWh)</option>
                <option value="false">Altfel / Cost Direct Custom</option>
            </select>
        </div>
        <div id="customCostContainer" class="full-width" style="display: none;">
            <label for="cost">Cost Direct (RON):</label>
            <input type="number" id="cost" step="0.01" placeholder="0.00" value="0">
        </div>
        <div class="full-width">
            <button type="submit" class="btn btn-primary">Adaugă Înregistrare</button>
        </div>
    </form>

    <div class="chart-container">
        <h2>Evoluție Consum (kWh/100km)</h2>
        <canvas id="consumptionChart"></canvas>
    </div>

    <h2>Istoric Încărcări</h2>
    <div class="table-container">
        <table id="logsTable">
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Km</th>
                    <th>Baterie</th>
                    <th>kWh</th>
                    <th>Cost Ședință</th>
                    <th>kWh/100km</th>
                    <th>RON/100km</th>
                    <th>Acțiune</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>

    <button id="exportBtn" class="btn btn-export">Descarcă Datele în Excel (CSV)</button>
</div>

<script>
    // Configurări Abonament
    const COST_ABONAMENT_LUNAR = 200;  // RON per ciclu
    const KWH_INCLUSE_LUNAR = 120;      // kWh per ciclu
    const TARIF_DEPASIRE_PER_KWH = 2.0; // RON/kWh extras
    const ZIUA_INCEPUT_ABONAMENT = 14;  // Resetare în data de 14 a fiecărei luni

    const firebaseConfig = {
        apiKey: "AIzaSyDIlGRpQGWtfdwrfZ3bllzM168UrcSyrkE",
        authDomain: "zoe-charge-log.firebaseapp.com",
        projectId: "zoe-charge-log",
        storageBucket: "zoe-charge-log.firebasestorage.app",
        messagingSenderId: "291247420360",
        appId: "1:291247420360:web:bd06ec76d83b6969ea86fd",
        measurementId: "G-4959FJEPFZ"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const collectionRef = db.collection('incarcari_zoe');

    const form = document.getElementById('chargeForm');
    const tableBody = document.querySelector('#logsTable tbody');
    const exportBtn = document.getElementById('exportBtn');
    const useSubscriptionSelect = document.getElementById('useSubscription');
    const customCostContainer = document.getElementById('customCostContainer');
    
    let chartInstance = null;
    let currentLogs = [];

    // Determină cheia unică a ciclului de abonament (ex: "2026-9" pentru 14 Sept - 13 Oct 2026)
    function getSubscriptionCycleKey(dateString) {
        const d = new Date(dateString);
        let year = d.getFullYear();
        let month = d.getMonth(); // 0-indexed (0 = Jan, 8 = Sep)

        if (d.getDate() < ZIUA_INCEPUT_ABONAMENT) {
            month -= 1;
            if (month < 0) {
                month = 11;
                year -= 1;
            }
        }
        return `${year}-${month + 1}`;
    }

    useSubscriptionSelect.addEventListener('change', function() {
        if (this.value === 'false') {
            customCostContainer.style.display = 'block';
        } else {
            customCostContainer.style.display = 'none';
        }
    });

    form.addEventListener('submit', async function(event) {
        event.preventDefault();

        const isSub = useSubscriptionSelect.value === 'true';
        let calculatedCost = 0;

        if (!isSub) {
            calculatedCost = Number(document.getElementById('cost').value) || 0;
        }

        const logEntry = {
            date: document.getElementById('date').value,
            km: Number(document.getElementById('km').value),
            batteryStart: Number(document.getElementById('batteryStart').value),
            batteryEnd: Number(document.getElementById('batteryEnd').value),
            kwh: Number(document.getElementById('kwh').value),
            isSubscription: isSub,
            manualCost: calculatedCost,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        try {
            await collectionRef.add(logEntry);
            form.reset();
            customCostContainer.style.display = 'none';
            setCustomDate();
        } catch (error) {
            alert("❌ Eroare la salvare: " + error.message);
        }
    });

    collectionRef.onSnapshot(snapshot => {
        let logs = [];
        snapshot.forEach(doc => {
            logs.push({ id: doc.id, ...doc.data() });
        });
        
        logs.sort((a, b) => new Date(a.date) - new Date(b.date));
        currentLogs = logs;
        
        renderApp(logs);
    }, error => {
        alert("❌ Eroare citire date: " + error.message);
    });

    async function deleteLog(id) {
        if (confirm("Sigur dorești să ștergi această înregistrare?")) {
            try {
                await collectionRef.doc(id).delete();
            } catch (error) {
                alert("Eroare la ștergere: " + error.message);
            }
        }
    }

    function renderApp(logs) {
        tableBody.innerHTML = '';

        let totalKwh = 0;
        let chartLabels = [];
        let chartData = [];
        
        let cycleKwhTracker = {};
        let activeCycles = new Set();

        const processedLogs = logs.map(log => {
            totalKwh += Number(log.kwh);
            const cycleKey = getSubscriptionCycleKey(log.date);

            let sessionCost = 0;

            if (log.isSubscription) {
                activeCycles.add(cycleKey);
                const currentCycleKwh = cycleKwhTracker[cycleKey] || 0;
                const newCycleKwh = currentCycleKwh + Number(log.kwh);

                if (newCycleKwh > KWH_INCLUSE_LUNAR) {
                    const extraKwh = Math.min(Number(log.kwh), newCycleKwh - KWH_INCLUSE_LUNAR);
                    sessionCost = extraKwh * TARIF_DEPASIRE_PER_KWH;
                } else {
                    sessionCost = 0;
                }
                cycleKwhTracker[cycleKey] = newCycleKwh;
            } else {
                sessionCost = Number(log.manualCost) || 0;
            }

            return { ...log, computedCost: sessionCost };
        });

        processedLogs.forEach((log, index) => {
            const row = document.createElement('tr');
            const dateObj = new Date(log.date);
            const formattedDate = dateObj.toLocaleDateString('ro-RO') + ' ' + dateObj.toLocaleTimeString('ro-RO', {hour: '2-digit', minute:'2-digit'});

            let kwhPer100 = '-';
            let ronPer100 = '-';

            if (index > 0) {
                const prevKm = processedLogs[index - 1].km;
                const dist = log.km - prevKm;

                if (dist > 0) {
                    const calcKwh = ((log.kwh / dist) * 100);
                    const calcRon = ((log.computedCost / dist) * 100);
                    kwhPer100 = calcKwh.toFixed(2);
                    ronPer100 = calcRon.toFixed(2);

                    chartLabels.push(formattedDate);
                    chartData.push(calcKwh.toFixed(2));
                }
            }

            row.innerHTML = `
                <td>${formattedDate}</td>
                <td>${log.km}</td>
                <td>${log.batteryStart}% → ${log.batteryEnd}%</td>
                <td>${log.kwh}</td>
                <td>${log.computedCost.toFixed(2)} RON</td>
                <td>${kwhPer100}</td>
                <td>${ronPer100}</td>
                <td><button class="btn-delete" onclick="deleteLog('${log.id}')">Șterge</button></td>
            `;
            tableBody.appendChild(row);
        });

        let totalExtraCosts = processedLogs.reduce((acc, l) => acc + l.computedCost, 0);
        let grandTotalCost = (activeCycles.size * COST_ABONAMENT_LUNAR) + totalExtraCosts;

        document.getElementById('statTotalCost').innerText = grandTotalCost.toFixed(2) + ' RON';
        document.getElementById('statTotalKwh').innerText = totalKwh.toFixed(2) + ' kWh';

        if (processedLogs.length > 1) {
            const totalDist = processedLogs[processedLogs.length - 1].km - processedLogs[0].km;
            if (totalDist > 0) {
                let sumKwhAfterFirst = 0;
                for(let i = 1; i < processedLogs.length; i++) {
                    sumKwhAfterFirst += Number(processedLogs[i].kwh);
                }
                const avgKwh = (sumKwhAfterFirst / totalDist) * 100;
                const avgCost = (grandTotalCost / totalDist) * 100;

                document.getElementById('statAvgKwh').innerText = avgKwh.toFixed(2) + ' kWh/100km';
                document.getElementById('statAvgCost').innerText = avgCost.toFixed(2) + ' RON/100km';
            }
        } else {
            document.getElementById('statAvgKwh').innerText = '- kWh/100km';
            document.getElementById('statAvgCost').innerText = '- RON/100km';
        }

        renderChart(chartLabels, chartData);
    }

    function renderChart(labels, data) {
        const ctx = document.getElementById('consumptionChart').getContext('2d');
        if (chartInstance) chartInstance.destroy();

        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Consum (kWh/100km)',
                    data: data,
                    borderColor: '#27ae60',
                    backgroundColor: 'rgba(39, 174, 96, 0.1)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.3
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: { beginAtZero: false, title: { display: true, text: 'kWh / 100 km' } }
                }
            }
        });
    }

    exportBtn.addEventListener('click', function() {
        if (currentLogs.length === 0) return alert('Nu există date de exportat!');

        let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
        csvContent += "Data,Km,Baterie Start,Baterie Final,kWh,Tip,Cost Calculat RON\n";

        currentLogs.forEach(log => {
            csvContent += `"${log.date}","${log.km}","${log.batteryStart}","${log.batteryEnd}","${log.kwh}","${log.isSubscription ? 'Abonament' : 'Direct'}","${log.computedCost || 0}"\n`;
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "jurnal_zoe.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });

    function setCustomDate() {
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('date').value = now.toISOString().slice(0,16);
    }

    setCustomDate();
</script>

</body>
</html>
